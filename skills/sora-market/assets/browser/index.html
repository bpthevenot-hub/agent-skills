<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sora Market — marketplace</title>
    <meta
      name="description"
      content="Sora Market, marketplace style AliExpress : catalogue, super deals, panier et commande démo."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="logo" href="#home" data-view="catalog">
          <span class="logo-mark">S</span>
          <span>
            <strong>Sora Market</strong>
            <small>Livraison mondiale · prix usine</small>
          </span>
        </a>
        <label class="search">
          <span class="sr-only">Rechercher un produit</span>
          <input
            id="search"
            type="search"
            placeholder="Écouteurs, veste, sécateur…"
            autocomplete="off"
          />
          <button type="button" id="search-btn">Rechercher</button>
        </label>
        <nav class="quick" id="quick">
          <button type="button" data-view="wishlist">Favoris <b id="wish-count">0</b></button>
          <button type="button" data-view="orders">Commandes</button>
          <button type="button" class="cart-btn" data-view="cart">
            Panier <b id="cart-count">0</b>
          </button>
        </nav>
      </div>
    </header>

    <div class="cats" id="cats" aria-label="Catégories"></div>

    <main>
      <section class="hero" id="hero">
        <div>
          <p class="eyebrow">Super deals du jour</p>
          <h1>Tout le catalogue, prix usine, comme sur une grande marketplace.</h1>
          <p>Livraison mondiale, boutiques vérifiées, retours 15 jours sur la démo.</p>
        </div>
        <div class="hero-badge">
          <strong>Livraison dès 0 €</strong>
          <span>Offerte dès 15 € d’achat</span>
        </div>
      </section>

      <section class="flash" id="flash" hidden>
        <div class="flash-head">
          <h2>Super deals</h2>
          <p>Prix barrés, stocks limités</p>
        </div>
        <div class="flash-row" id="flash-row"></div>
      </section>

      <div class="toolbar" id="toolbar">
        <label class="check">
          <input id="ship-filter" type="checkbox" />
          Livraison gratuite
        </label>
        <label>
          Note min.
          <select id="rating-filter">
            <option value="0">Toutes</option>
            <option value="4">4+</option>
            <option value="4.5">4,5+</option>
          </select>
        </label>
        <label>
          Trier
          <select id="sort">
            <option value="orders">Meilleures ventes</option>
            <option value="price-asc">Prix croissant</option>
            <option value="price-desc">Prix décroissant</option>
            <option value="discount">Plus grosse promo</option>
          </select>
        </label>
      </div>

      <section class="grid" id="grid" aria-live="polite"></section>
      <section class="page" id="page" hidden></section>
    </main>

    <div class="overlay" id="overlay" hidden>
      <article class="sheet" id="sheet" role="dialog" aria-modal="true"></article>
    </div>

    <p class="toast" id="toast" role="status"></p>
    <script type="module" src="./app.js"></script>
  </body>
</html>
